[project]
name = "mcp-info-gatherer"
version = "0.1.0"
description = "MCP server for information gathering — web search, Twitter/X search, Telegram search"
authors = [{ name = "Evgeniy Skuratov" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "tavily-python>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
mcp-info-gatherer = "mcp_info_gatherer.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_info_gatherer"]

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "mcp>=1.28.1",
]
